[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maverickx"
version = "0.1.0"
description = "Post-batch anomaly detection for historical fermentation sensor data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "joblib==1.6.0",
  "matplotlib==3.11.2",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.1",
  "shap==0.49.1",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pyarrow==26.0.0", "pytest>=8"]

[project.scripts]
maverickx = "maverickx.cli:main"
maverickx-web = "maverickx.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maverickx = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

