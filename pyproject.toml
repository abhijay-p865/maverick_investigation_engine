[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maverickx"
version = "0.1.0"
description = "Post-batch anomaly detection for historical fermentation sensor data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6",
  "scikit-learn>=1.4",
  "shap>=0.46,<0.50",
  "python-multipart>=0.0.18",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8"]

[project.scripts]
maverickx = "maverickx.cli:main"
maverickx-web = "maverickx.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maverickx = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

